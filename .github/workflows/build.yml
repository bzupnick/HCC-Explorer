name: Build HCC Explorer

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build (parse CMS files, embed into index.html)
        run: |
          python3 scripts/parse_cms.py
          python3 scripts/build.py

      - name: Sanity-check output
        run: |
          test -s index.html
          python3 - <<'EOF'
          import json, re
          html = open("index.html").read()
          m = re.search(r'^const ALL = (\{.*\});$', html, re.M)
          assert m, "embedded data payload not found in index.html"
          data = json.loads(m.group(1))
          expected = {"v28", "v24", "esrd", "hhs", "rx"}
          assert set(data) == expected, f"models mismatch: {set(data)}"
          for k, d in data.items():
              assert d["hccs"] and d["icds"] and d["edgesFull"], f"{k}: empty data"
          print("OK:", {k: len(d["hccs"]) for k, d in data.items()})
          EOF

      - name: Stage site
        if: github.ref == 'refs/heads/main'
        run: mkdir -p _site && cp index.html _site/

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
